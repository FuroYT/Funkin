name: Build and Upload nightly game builds

on:
  workflow_dispatch:
    inputs:
      build-defines:
        type: string
        description: Build defines to use
        default: '-DGITHUB_BUILD -DNO_FEATURE_NEWGROUNDS'
      save-artifact:
        type: boolean
        description: Save the build artifact to Github Actions (sends to itch otherwise)
        default: true
  push:

env:
  IS_SECRET_REPO: ${{ github.repository == 'FunkinCrew/Funkin-secret' }}

jobs:

  gather-changes:
    if: github.repository == 'FunkinCrew/Funkin-secret'
    runs-on: build-set
    outputs:
      trigger-build: ${{ steps.should-trigger.outputs.result }}
    steps:
      - uses: funkincrew/ci-checkout@v7.3.3
        with:
          submodules: false

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            docker:
              - '.github/workflows/build-game.yml'
              - '**/Dockerfile'

      - uses: actions/github-script@v8
        id: should-trigger
        with:
          result-encoding: string
          script: |
            const { payload } = context
            const changes = ${{ steps.filter.outputs.changes }}
            const manual = payload?.commits?.some(c =>
              c.message.toLowerCase().replace(/\W/g, " ").includes("docker rebuild")
            )

            return payload.created
              || payload.forced
              || changes?.includes("docker")
              || manual

  gather-tags:
    if: github.repository == 'FunkinCrew/Funkin-secret'
    runs-on: build-set
    outputs:
      primary: ${{ steps.build-tags.outputs.primary }}
      list: ${{ steps.build-tags.outputs.list }}
    steps:
      - uses: actions/github-script@v7
        id: build-tags
        with:
          script: |
            const base = "ghcr.io/funkincrew/build-dependencies"
            const default_branch = "rewrite/master"

            const ref_path = context.ref.split("/").slice(2)
            const ref = ref_path.join("/")
            const ref_tag = ref_path.join("-")

            const tags = [ref_tag, context.sha]

            if (ref === default_branch) tags.push("latest")

            core.setOutput("primary", ref_tag)
            core.setOutput("list", tags.map(t => `${base}:${t}`).join("\n"))

  docker-image:
    needs: [gather-changes, gather-tags]
    if: needs.gather-changes.outputs.trigger-build == 'true' && github.repository == 'FunkinCrew/Funkin-secret'
    runs-on: build-set
    permissions:
      contents: read
      packages: write
    steps:
      - uses: funkincrew/ci-checkout@v7.3.3
        with:
          submodules: false

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./build
          push: true
          tags: ${{ needs.gather-tags.outputs.list }}

  build-game-on-host:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            runs-on: windows-latest
          - target: mac
            runs-on: macos-latest
          - target: ios
            runs-on: macos-latest

    runs-on: ${{ matrix.runs-on }}

    defaults:
      run:
        shell: bash

    env:
      BUILD_DEFINES: ${{ github.event.inputs.build-defines || '-DGITHUB_BUILD' }}

    steps:
      - run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Create app token (secret repo only)
        if: env.IS_SECRET_REPO == 'true'
        id: secret_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PEM }}
          owner: ${{ github.repository_owner }}

      - name: Get checkout token
        id: app_token
        run: |
          if [ "$IS_SECRET_REPO" = "true" ]; then
            echo "TOKEN=${SECRET_TOKEN}" >> $GITHUB_OUTPUT
          else
            echo "TOKEN=${GITHUB_TOKEN}" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECRET_TOKEN: ${{ steps.secret_token.outputs.token }}

      - name: Set submodule aliases
        run: |
          if [ "$GITHUB_REPOSITORY" = "FunkinCrew/Funkin-secret" ]; then
            ALIASES=$'https://github.com/FunkinCrew/Funkin.assets > https://github.com/FunkinCrew/Funkin-assets-secret\nhttps://github.com/FunkinCrew/Funkin.art > https://github.com/FunkinCrew/Funkin-art-secret'
          else
            ALIASES=""
          fi

          echo "ALIASES<<EOF" >> $GITHUB_ENV
          echo "$ALIASES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - uses: funkincrew/ci-checkout@v7.3.3
        with:
          submodules: 'recursive'
          token: ${{ steps.app_token.outputs.TOKEN }}
          persist-credentials: false
          submodule-aliases: ${{ env.ALIASES }}

      - uses: ./.github/actions/setup-haxe
        with:
          gh-token: ${{ steps.app_token.outputs.TOKEN }}

      - name: Recompile hxcpp tools
        run: |
          cd .haxelib/hxcpp/git/tools/hxcpp
          haxe compile.hxml

      - name: Recompile lime
        run: |
          haxelib run lime rebuild cpp
          haxelib run lime rebuild tools

      - name: Build game (Windows)
        if: ${{ matrix.target == 'windows' }}
        run: haxelib run lime build windows -v -release $BUILD_DEFINES
        timeout-minutes: 120

      - name: Build game (Unix)
        if: ${{ matrix.target != 'windows' && matrix.target != 'ios' }}
        run: haxelib run lime build ${{ matrix.target }} -v -release --times $BUILD_DEFINES

      - name: Build game (iOS)
        if: ${{ matrix.target == 'ios' }}
        run: haxelib run lime build ios -v -release --times -DNO_FEATURE_MOBILE_IAR $BUILD_DEFINES -nosign
        timeout-minutes: 120

      - name: Save build artifact
        if: ${{ github.event.inputs.save-artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: export/release/${{matrix.target}}/bin/

      - uses: ./.github/actions/upload-itch
        if: ${{ !github.event.inputs.save-artifact }}
        with:
          butler-key: ${{ secrets.BUTLER_API_KEY }}
          target: ${{ matrix.target }}

  build-game-in-container:
    needs: [gather-tags]
    if: ${{ github.repository == 'FunkinCrew/Funkin-secret' && !cancelled() }}
    runs-on: build-set
    container: ghcr.io/funkincrew/build-dependencies:${{ needs.gather-tags.outputs.primary }}

    strategy:
      matrix:
        include:
          - target: linux
          - target: html5

    defaults:
      run:
        shell: bash

    env:
      BUILD_DEFINES: ${{ github.event.inputs.build-defines || '-DGITHUB_BUILD' }}

    steps:
      - uses: actions/create-github-app-token@v1
        id: app_token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PEM }}
          owner: ${{ github.repository_owner }}

      - name: Set submodule aliases
        run: |
          if [ "$GITHUB_REPOSITORY" = "FunkinCrew/Funkin-secret" ]; then
            ALIASES=$'https://github.com/FunkinCrew/Funkin.assets > https://github.com/FunkinCrew/Funkin-assets-secret\nhttps://github.com/FunkinCrew/Funkin.art > https://github.com/FunkinCrew/Funkin-art-secret'
          else
            ALIASES=""
          fi

          echo "ALIASES<<EOF" >> $GITHUB_ENV
          echo "$ALIASES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - uses: funkincrew/ci-checkout@v7.3.3
        with:
          submodules: 'recursive'
          token: ${{ steps.app_token.outputs.token }}
          persist-credentials: false
          submodule-aliases: ${{ env.ALIASES }}

      - run: haxelib --global run hmm install -q

      - run: haxelib run lime build ${{ matrix.target }} -v -release --times $BUILD_DEFINES
        timeout-minutes: 120

      - name: Save build artifact
        if: ${{ github.event.inputs.save-artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: export/release/${{matrix.target}}/bin/

      - uses: ./.github/actions/upload-itch
        if: ${{ !github.event.inputs.save-artifact }}
        with:
          butler-key: ${{ secrets.BUTLER_API_KEY }}
          target: ${{ matrix.target }}
